# This file has been modified for Oracle Java SE extension

name: Java Platform Support for Visual Studio Code

on:
  push:
  pull_request:
    # unlocked event is used as super secret restart button
    types: [opened, synchronize, unlocked]

# cancel other PR workflow run in the same head-base group if it exists (e.g. during PR syncs)
# if this is not a PR run (no github.head_ref and github.base_ref defined), use an UID as group
concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.base_ref }}
  cancel-in-progress: true

jobs:

  # primary build job, most other jobs use the artifact produced here
  # artifact is only produced once in the matrix
  base-build:
    name: Base Build
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '25' ]
        os: [ ubuntu-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:

      - name: Set up JDK ${{ matrix.java }}
        uses: oracle-actions/setup-java@v1
        with:
          release: ${{ matrix.java }}

      - name: Checkout ${{ github.ref }} ( ${{ github.sha }} )
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      # add g1 certificate pending further review; the certificate is needed to access https://netbeans.osuosl.org
      # Note – careful attention should be paid to the status of this certificate going forward and use of this certificate is not recommended without consideration.
      - name: Update certificates
        run: |
            wget https://repository.emsign.com/certs/emSignRootCAG1.crt
            keytool -printcert -file emSignRootCAG1.crt | grep "SHA256: 40:F6:AF:03:46:A9:9A:A1:CD:1D:55:5A:4E:9C:CE:62:C7:F9:63:46:03:EE:40:66:15:83:3D:C8:C8:D0:03:67" || echo "wrong certificate"
            keytool -importcert -cacerts -file emSignRootCAG1.crt -alias "emsignrootcag1 [jdk]" -noprompt

      - name: Apply NetBeans patches
        run: ant apply-patches

      - name: Build NetBeans
        run: ant build-netbeans

      - name: Build the Visual Studio Extension
        run: ant build-vscode-ext

      - name: Install virtual X server
        run: sudo apt install -y xvfb

      - name: Basic tests for the Visual Studio Extension
        run: xvfb-run -a ant test-vscode-ext
